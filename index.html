<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Protocol</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#050505;
    overflow:hidden;
    font-family:Consolas, monospace;
}

/* TERMINAL */

#terminal{
    position:absolute;
    inset:0;
    padding:40px;
    color:#ff6b9f;
    background:#050505;
}

#text{
    white-space:pre-wrap;
    font-size:1.1rem;
    line-height:1.8;
}

.cursor{
    animation:blink .8s infinite;
}

@keyframes blink{
    50%{
        opacity:0;
    }
}

#decryptBtn{
    display:none;
    margin-top:30px;
    padding:14px 30px;
    border:none;
    cursor:pointer;
    background:#ff2d6f;
    color:white;
    font-size:1rem;
    border-radius:8px;
    box-shadow:0 0 20px #ff2d6f;
}

/* HEART SCREEN */

#heartScreen{
    display:none;
    position:absolute;
    inset:0;
    background:black;
}

canvas{
    width:100%;
    height:100%;
}

.centerText{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:clamp(35px,5vw,70px);
    font-weight:bold;
    text-shadow:
        0 0 10px #fff,
        0 0 20px #ff3d6e,
        0 0 40px #ff3d6e;
    pointer-events:none;
}

.flash{
    position:absolute;
    inset:0;
    background:#ff255f;
    opacity:0;
    pointer-events:none;
}

</style>
</head>
<body>

<div id="terminal">
<pre id="text"></pre>
<button id="decryptBtn">DECRYPT MESSAGE</button>
</div>

<div id="heartScreen">
<canvas id="canvas"></canvas>
<div class="centerText">LOVE YOU</div>
<div class="flash" id="flash"></div>
</div>

<script>

const terminalText =
`[system] Initializing heart.PROTOCOL_v2.0...

[status] READY

> Scanning encrypted files...
> Package detected.
> Authenticating...
> Access granted.

> One encrypted message found.
> Message ready for decryption.
`;

const textElement = document.getElementById("text");
const button = document.getElementById("decryptBtn");

let i = 0;

function typeWriter(){

    if(i < terminalText.length){
        textElement.innerHTML =
            terminalText.substring(0,i) +
            '<span class="cursor">|</span>';

        i++;
        setTimeout(typeWriter,35);
    }
    else{
        textElement.innerHTML = terminalText;
        button.style.display = "block";
    }
}

typeWriter();

button.onclick = () => {

    const flash = document.getElementById("flash");

    document.getElementById("heartScreen").style.display="block";

    flash.animate(
        [
            {opacity:0},
            {opacity:.9},
            {opacity:0}
        ],
        {
            duration:900
        }
    );

    setTimeout(()=>{
        document.getElementById("terminal").style.display="none";
    },400);

    startHeart();
};

function startHeart(){

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = innerWidth;
    canvas.height = innerHeight;
}
resize();

window.addEventListener("resize",resize);

const particles = [];

for(let t=0;t<Math.PI*2;t+=0.02){

    let x = 16*Math.pow(Math.sin(t),3);

    let y =
        13*Math.cos(t)
        -5*Math.cos(2*t)
        -2*Math.cos(3*t)
        -Math.cos(4*t);

    for(let i=0;i<4;i++){

        particles.push({
            x:x,
            y:y,
            text:"I love you",
            offset:Math.random()*Math.PI*2
        });
    }
}

function animate(){

    requestAnimationFrame(animate);

    ctx.clearRect(0,0,canvas.width,canvas.height);

    let pulse =
        1 + 0.08*Math.sin(Date.now()*0.003);

    const scale =
        Math.min(canvas.width,canvas.height)/40;

    ctx.textAlign="center";

    particles.forEach((p,index)=>{

        let px =
            canvas.width/2 +
            p.x*scale*pulse +
            Math.sin(Date.now()*0.001+p.offset)*3;

        let py =
            canvas.height/2 -
            p.y*scale*pulse +
            Math.cos(Date.now()*0.001+p.offset)*3;

        ctx.font="13px Arial";

        ctx.shadowBlur=15;
        ctx.shadowColor="#ff3d6e";

        let glow =
            180 +
            Math.sin(Date.now()*0.004+index)*75;

        ctx.fillStyle =
            rgb(255,${glow/3},${glow/2});

        ctx.fillText(p.text,px,py);
    });

}

animate();

}

</script>

</body>
</html>
